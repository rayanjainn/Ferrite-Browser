<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shipping details</title><link rel="stylesheet" href="demo.css">
<style>
body { background: #f6f7f8; }
form { width: 420px; margin: 0; padding: 18px 18px 60px; }
label { display: block; font-weight: 700; font-size: 15px; margin: 0 0 8px; }
input, select { width: 340px; height: 36px; border: 1px solid #c9cdd2; border-radius: 6px; padding: 0 10px; font-size: 14px; background: #fff; margin-bottom: 26px; font-family: inherit; }
</style></head>
<body>
<form class="card">
  <label for="n">Full name</label><input id="n" value="Ada Lovelace">
  <label for="c">Country</label>
  <select id="c"><option>Canada</option><option>France</option><option selected>Germany</option><option>India</option><option>Japan</option><option>Netherlands</option><option>United Kingdom</option><option>United States</option></select>
  <label for="p">Photo ID</label><input id="p" type="file" accept=".pdf,.png">
</form>
</body></html>
