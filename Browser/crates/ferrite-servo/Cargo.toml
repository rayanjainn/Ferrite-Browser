[package]
name = "ferrite-servo"
version = "0.1.0"
edition = "2021"

[features]
# Enable Servo engine integration:
#   cargo build -p ferrite-servo --features servo
#   cargo build -p ferrite-shell --features ferrite-servo/servo
#
# NOTE: enabling this feature will produce a rusqlite version conflict between
# ferrite-audit-log (rusqlite 0.31) and libservo (rusqlite 0.37).  Fix:
# upgrade ferrite-audit-log to rusqlite = "0.37" with features = ["bundled"].
servo = ["dep:libservo"]

[dependencies]
raw-window-handle = "0.6"
winit = "0.30"
log = "0.4"

# Optional — only resolved when the `servo` feature is enabled.
# Package name in the repo is `libservo`; the lib is named `servo` internally
# so Rust imports use `use servo::...`.
libservo = { git = "https://github.com/servo/servo", tag = "v0.0.5", optional = true }
