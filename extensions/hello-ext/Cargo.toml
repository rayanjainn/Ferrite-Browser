# This crate is a Wasm guest module — it must NOT be part of the host Cargo
# workspace.  The empty [workspace] table below opts it out explicitly.
[workspace]

[package]
name = "hello-ext"
version = "0.1.0"
edition = "2021"

# cdylib is required for Wasm modules loaded by extism.
[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"

# Build instructions:
#   cargo build --target wasm32-unknown-unknown --release
#
# Output:
#   extensions/hello-ext/target/wasm32-unknown-unknown/release/hello_ext.wasm
#
# Prerequisites (one-time):
#   rustup target add wasm32-unknown-unknown
