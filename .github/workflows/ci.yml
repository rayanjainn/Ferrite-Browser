name: CI

on:
  push:
    branches: [main]
    paths:
      - 'Browser/**'
      - '.devcontainer/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Browser/**'
      - '.devcontainer/**'
      - '.github/workflows/ci.yml'

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Build, lint, test — matrix across Windows & macOS
  # ─────────────────────────────────────────────────────────────
  ci:
    name: Build, Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            binary_suffix: ".exe"
          - os: macos-latest
            platform: macos
            binary_suffix: ""

    defaults:
      run:
        working-directory: Browser

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew update
          brew install cmake pkg-config openssl gstreamer sqlite
        working-directory: .

      - name: Install system dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install -y cmake sqlite
        working-directory: .

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Browser
          key: ${{ matrix.platform }}

      - name: Fetch dependencies
        run: cargo fetch

      - name: Check formatting
        if: matrix.platform == 'linux'
        run: cargo fmt --check

      - name: Clippy (zero warnings)
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build hello-ext Wasm
        if: matrix.platform == 'linux'
        run: |
          cd ../extensions/hello-ext
          cargo build --target wasm32-unknown-unknown --release
        working-directory: Browser

      - name: Build release binary
        run: cargo build --release -p ferrite-shell --features ferrite-servo/servo

      # ── Derive binary label from commit message ───────────────
      # Convention: include [T<task>.<block>] anywhere in the commit.
      # Examples:  [T7.3]   [T9.1]   [T14.2]
      # Fallback: first 7 chars of the commit SHA.
      - name: Derive binary label
        id: label
        shell: bash
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if [[ "$MSG" =~ \[T([0-9]+\.[0-9]+)\] ]]; then
            LABEL="${BASH_REMATCH[1]}"
          else
            SHA="${{ github.sha }}"
            LABEL="${SHA:0:7}"
          fi
          echo "binary_label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "Resolved binary label: $LABEL"

      - name: Stage executable
        shell: bash
        run: |
          LABEL="${{ steps.label.outputs.binary_label }}"
          PLATFORM="${{ matrix.platform }}"
          EXT="${{ matrix.binary_suffix }}"
          mkdir -p staged
          cp "target/release/ferrite-shell${EXT}" "staged/ferrite-${LABEL}-${PLATFORM}${EXT}"
          echo "Staged: staged/ferrite-${LABEL}-${PLATFORM}${EXT}"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferrite-${{ steps.label.outputs.binary_label }}-${{ matrix.platform }}
          path: Browser/staged/
          retention-days: 90

  # ─────────────────────────────────────────────────────────────
  # Job 2: Publish a rolling "latest" GitHub Release.
  # Runs only on pushes to main — never on PRs.
  #
  # Every push replaces the previous "latest" release's assets.
  # The release tag stays "latest"; only the binaries inside
  # it change. Full history is preserved via the commit SHA
  # baked into each filename.
  # ─────────────────────────────────────────────────────────────
  release:
    name: Publish rolling release
    runs-on: ubuntu-22.04
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rederive the label — same logic as the ci job above
      - name: Derive binary label
        id: label
        shell: bash
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if [[ "$MSG" =~ \[T([0-9]+\.[0-9]+)\] ]]; then
            LABEL="${BASH_REMATCH[1]}"
          else
            SHA="${{ github.sha }}"
            LABEL="${SHA:0:7}"
          fi
          echo "binary_label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ferrite-${{ steps.label.outputs.binary_label }}-windows
          path: downloaded/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ferrite-${{ steps.label.outputs.binary_label }}-macos
          path: downloaded/macos

      # ── Build release body with metadata ─────────────────────
      - name: Build release notes
        id: notes
        shell: bash
        run: |
          LABEL="${{ steps.label.outputs.binary_label }}"
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          MSG="${{ github.event.head_commit.message }}"

          cat <<EOF > release_notes.md
          ## ferrite-browser · latest

          > This release is **overwritten on every push to main.**
          > It always contains the most recent passing build.

          | Field   | Value |
          |---------|-------|
          | Label   | \`$LABEL\` |
          | Commit  | [\`$SHORT\`](https://github.com/${{ github.repository }}/commit/$SHA) |
          | Date    | $DATE |
          | Message | $MSG |

          ### Downloads
          | Platform | File |
          |----------|------|
          | Windows  | \`ferrite-${LABEL}-windows.exe\` |
          | macOS    | \`ferrite-${LABEL}-macos\` |
          EOF

          echo "Generated release notes"

      # ── Delete old "latest" tag so we can recreate it ────────
      # softprops/action-gh-release can't update a lightweight tag
      # already pointing to a different commit — easier to nuke it.
      - name: Delete existing "latest" tag (if any)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      # ── Create fresh "latest" release with both binaries ─────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ferrite-browser · latest build"
          body_path: release_notes.md
          prerelease: true          # marks it as "Pre-release" — not a stable tag
          make_latest: true
          files: |
            downloaded/windows/ferrite-${{ steps.label.outputs.binary_label }}-windows.exe
            downloaded/macos/ferrite-${{ steps.label.outputs.binary_label }}-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}